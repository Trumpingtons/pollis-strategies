# Publishes the strategies on every push to main (a merged pull request included): checks them with
# scripts/strategies.ts and replaces the branch dist, one commit with no history, by the files it writes:
# strategies.json and each strategy's file. Pollis reads them from
# https://raw.githubusercontent.com/Trumpingtons/pollis-strategies/dist/strategies.json
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check and write the catalogue
        run: node scripts/strategies.ts publish out
      - name: Replace the branch dist
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Strategies, from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
